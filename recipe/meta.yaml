{% set version = "3.31.12" %}

package:
  name: cmake
  version: {{ version }}

source:
  - url: https://github.com/Kitware/CMake/releases/download/v{{ version }}/cmake-{{ version }}.tar.gz
    sha256: 5f3fd5a54dfa65602bdbed64f981a72673cc19f2d304cc2955cf0dfa0cfd8272
  - url: https://cmake.org/files/v{{ version[:4] }}/cmake-{{ version }}-windows-x86_64.zip  # [win and x86_64]
    sha256: 0c4baa40f28b3f8225eb3fdf6946c987b4fe901403b4eaf2fbbd9378100aaa0c  # [win and x86_64]
    folder: cmake-bin  # [win and x86_64]
  - url: https://github.com/Kitware/CMake/releases/download/v{{ version }}/cmake-{{ version }}-windows-arm64.zip  # [win and arm64]
    sha256: e4160c1842dea858ad376ff2ec17587104515b51714eca5963b8bdd798105553  # [win and arm64]
    folder: cmake-bin  # [win and arm64]

build:
  number: 0
  ignore_run_exports:
    - vc

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake-no-system  # [unix]
    - ninja-base
  host:
    - bzip2 {{ bzip2 }}
    - libcurl {{ libcurl }}  # [unix]
    - expat {{ expat }}  # [unix]
    - ncurses {{ ncurses }}  # [unix]
    - xz {{ xz }}
    - zlib {{ zlib }}
    - libuv {{ libuv }}
    - rhash  {{ rhash }}  # [unix]
    - zstd {{ zstd }}
  run:
    - bzip2
    - libcurl         # [unix]
    - expat           # [unix]
    - ncurses         # [unix]
    - xz
    - zlib
    - libuv
    - rhash           # [unix]
    - zstd
    - vs2015_runtime  # [win]

test:
  files:
    - SSLTest.cmake
  commands:
    - cmake --version
    - cmake -V -P SSLTest.cmake
    - ctest --version
    - cpack --version
    - ccmake --version  # [unix]

about:
  home: https://cmake.org/
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - Copyright.txt
    - Utilities/cmbzip2/LICENSE         # [win]
    - Utilities/cmcurl/COPYING          # [win]
    - Utilities/cmexpat/COPYING         # [win]
    - Utilities/cmliblzma/COPYING       # [win]
    - Utilities/cmzlib/Copyright.txt    # [win]
    - Utilities/cmlibuv/LICENSE         # [win]
    - Utilities/cmlibrhash/COPYING      # [win]
    - Utilities/cmlibarchive/COPYING
    - Utilities/cmjsoncpp/LICENSE
    - Licenses/LGPLv2.1.txt
    - Licenses/LGPLv3.txt
  summary: CMake is an extensible, open-source system that manages the build process
  description: |
    CMake is a cross-platform, open-source build system generator.
  dev_url: https://gitlab.kitware.com/cmake/cmake
  doc_url: https://cmake.org/documentation/

extra:
  recipe-maintainers:
    - blowekamp
    - groutr
    - jakirkham
    - jschueller
    - ocefpaf
    - msarahan
    - scopatz
    - tadeu
    - marcelotrevisani
    - mingwandroid
